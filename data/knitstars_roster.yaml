# Observations (2026-08-07):
# - Anchor overlap: Weisenberger + West (S1), Herzog + Mowry (S2),
#   Gardiner/Shayne (S3, S10), Hunter (S4), Parkes + Gaughan (S10),
#   Melanie Falick (gatekeeper editor, Genius season).
# - Conspicuously ABSENT across all seasons: PetiteKnit, Isabell Kraemer,
#   Joji Locatelli, the Danish wave — the Instagram mega-tier doesn't
#   appear. KnitStars selects for teaching/community prestige, a separate
#   currency from algorithmic reach. Supports the "different games"
#   observation and H2's multi-currency structure.
# - Recent seasons lean harder into legacy figures (Parkes, Gaughan,
#   Bliss, Knight, Falick) — the prestige panel increasingly anoints
#   institutional/blog-era figures rather than new algorithm-era stars.

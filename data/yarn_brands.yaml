# Fold renamed / sub-label companies into one brand key (ids are Ravelry
# yarn_company_id, found from the near-duplicate list in notebook section 0).
# Knit Picks has no second id in the panel: WeCrochet yarns are linked
# under Knit Picks (96).
company_aliases:
  - id: 45
    name: Patons
    aliases: [4403, 4417]     # Patons Australia, Patons UK
  - id: 10437
    name: Regia
    aliases: [13336]          # Schachenmayr Regia (same line, renamed)
  - id: 19
    name: Cascade Yarns
    aliases: [30013]          # stray duplicate entry
  - id: 8150
    name: DyeForYarn
    aliases: [9089]           # DyeForWool

# Ownership changes among panel brands, for the markers on the site's line
# chart. Dates are the announced completion month. Only events with dated
# press coverage are listed as confirmed; `confirmed: false` entries rest
# on a single secondary page and are kept out of the chart.
company_events:
  - company: Knit Picks
    date: 2017-02
    buyer: Premier Needle Arts (Blue Point Capital)
    note: parent Crafts Americana Group sold to a private-equity-backed group
    source: https://peprofessional.com/2017/02/blue-point-adds-premier-needle-arts/
  - company: Rowan
    date: 2015-07
    buyer: Aurelius (MEZ)
    note: Coats sold its European crafts business, Rowan and Regia with it
    source: https://apparelresources.com/business-news/trade/emea-crafts-business-coats-acquired-aurelius
  - company: Regia
    date: 2015-07
    buyer: Aurelius (MEZ)
    note: Coats sold its European crafts business, Rowan and Regia with it
    source: https://apparelresources.com/business-news/trade/emea-crafts-business-coats-acquired-aurelius
  - company: Rowan
    date: 2020-04
    buyer: DMC Group (Lion Capital)
    note: MEZ sold the Rowan and Patons UK hand-knitting business
    source: https://www.marketscreener.com/quote/stock/AURELIUS-EQUITY-OPPORTUNI-494695/news/AURELIUS-Equity-Opportunities-subsidiary-MEZ-sells-hand-knitting-yarn-segment-of-the-Rowan-and-Pat-30501153/
  - company: Patons North America
    date: 2015-10
    buyer: TorQuest Partners
    note: parent Spinrite sold by Sentinel Capital to TorQuest
    source: https://www.rwbaird.com/transactions/investment-banking/dealcard/4829
  - company: Patons North America
    date: 2018-07
    buyer: Comvest Partners
    note: Spinrite sold on to Comvest
    source: https://peprofessional.com/2018/07/comvest-acquires-spinrite/
  - company: Bernat
    date: 2015-10
    buyer: TorQuest Partners
    note: parent Spinrite sold by Sentinel Capital to TorQuest
    source: https://www.rwbaird.com/transactions/investment-banking/dealcard/4829
  - company: Bernat
    date: 2018-07
    buyer: Comvest Partners
    note: Spinrite sold on to Comvest
    source: https://peprofessional.com/2018/07/comvest-acquires-spinrite/
  - company: Caron

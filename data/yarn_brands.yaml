    note: National Spinning sold the Caron yarn lines to Spinrite
    source: https://www.textileworld.com/textile-world/textile-news/2011/12/national-spinning-sells-caron-international-to-spinrite/
  - company: Caron
    date: 2015-10
    buyer: TorQuest Partners
    buyer_type: pe
    note: parent Spinrite sold by Sentinel Capital to TorQuest
    source: https://www.rwbaird.com/transactions/investment-banking/dealcard/4829

# Yarn-brand panel: long-lived ("evergreen") patterns whose projects span
# most of Ravelry's life, plus a few recent anchors so 2017-2026 is not
# carried by aging patterns alone. Brand share is measured within each
# pattern by project start year, then averaged across patterns.
#
# Pattern ids and publish years were confirmed against patterns/{id}.json
# on 2026-10-20 (projects= is Ravelry's count that day). Check again with:
#   uv run scripts/enrich_projects.py --roster yarn-brands --resolve
#
# stratum: shawl | sock | hat | cowl | garment     weight: Ravelry's label
# role: evergreen (published <= 2013) | anchor (recent, 5+ years of data)


# Curated career-start overrides for case-study designers whose
# first-published-pattern date misrepresents their actual entry.
# Applied wherever entrance year is computed from pattern dates.
# Each entry needs a reason — these are editorial judgments and every
# one gets disclosed in methods notes.
overrides:
  - designer_id: 32020
    designer_name: "Emma Jaeger"
    career_start: "2024-08-01"
    first_pattern_date: "2010-06-01"
    reason: >
      Four teenage-era patterns 2010-2012 (incl. an iPod shuffle
      pouch — the artifact dates itself), modest blog-era traction
      (Viridescent 617 favs), then twelve dormant years. Career
      relaunch as midsummer.knits with Heartless Top, August 2024.
      Coding her as class of 2010 would misstate a modern breakout as
      a fifteen-year veteran. Becca's call, 2026-08-09. The dormancy
      makes her a re-entry, not a cold entry — disclose when cited.
